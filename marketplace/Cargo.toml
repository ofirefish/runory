[package]
name = "runory-marketplace"
version = "0.1.0"
edition = "2021"
description = "Runory Plugin Marketplace backend (PP5)"
publish = false

[[bin]]
name = "runory-marketplace"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
