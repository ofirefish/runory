[package]
name = "runory"
version = "0.1.0"
description = "Runory SSH infrastructure client"
authors = ["Runory"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "runory_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
async-trait = "0.1"
base64 = "0.22.1"
futures-util = "0.3"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hpke = { version = "0.14.0", default-features = false, features = ["alloc", "chacha", "x25519"] }
rand = "0.8.5"
rand_chacha = { version = "0.10.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
ring = "0.17.14"
rusqlite = { version = "0.32", features = ["bundled"] }
russh = { version = "0.63.1", default-features = false, features = ["ring"] }
russh-sftp = "2.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
zeroize = { version = "1", features = ["zeroize_derive"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast", "zeroize"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2.3.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
open = "5"
tauri-plugin-stronghold = "2.3.1"

[dev-dependencies]

# Stronghold snapshot encryption and Argon2 are prohibitively slow with fully
# unoptimized dependency code. Keep Runory itself debuggable while compiling
# third-party dependencies with enough optimization for interactive dev use.
[profile.dev.package."*"]
opt-level = 2
