<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f4f5;font-family:Arial,sans-serif;color:#18181b">
    <div style="max-width:560px;margin:0 auto;padding:40px 20px">
      <div style="background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:32px">
        <h1 style="margin:0 0 16px;font-size:22px">Confirm your new Runory email</h1>
        <p style="line-height:1.6">Confirm changing your account email to {{ .NewEmail }}.</p>
        <p style="line-height:1.6">确认将 Runory 账号邮箱更改为 {{ .NewEmail }}。</p>
        <p style="margin:28px 0"><a href="{{ .ConfirmationURL }}" style="background:#18181b;color:#fff;text-decoration:none;border-radius:8px;padding:12px 18px">Confirm change / 确认更改</a></p>
        <p style="font-size:12px;color:#71717a;line-height:1.6">If you did not request this change, ignore this email. 如果这不是你的操作，请忽略此邮件。</p>
      </div>
    </div>
  </body>
</html>
