<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4f4f5;font-family:Arial,sans-serif;color:#18181b">

      <div style="background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:32px">
        <h1 style="margin:0 0 16px;font-size:22px">Confirm your Runory email</h1>

        <p style="font-size:12px;color:#71717a;line-height:1.6">If you did not create this account, ignore this email. 如果这不是你的操作，请忽略此邮件。</p>
      </div>
