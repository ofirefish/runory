<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1a29" />
    <title>Runory</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        overflow: hidden;
        background: #f4f6f9;
        color: #121826;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html.dark body { background: #0f1a29; color: #f2f5f9; }

      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: grid;
        place-items: center;
        pointer-events: none;
        background: inherit;
        color: inherit;
        opacity: 1;
        transition: opacity 320ms ease, visibility 320ms ease;
      }
      #boot-splash.is-leaving {
        opacity: 0;
        visibility: hidden;
      }
      #boot-splash[hidden] { display: none; }

      .boot-splash-stage {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 22px;
        padding: 24px;
        text-align: center;
      }

      /* Soft brand wash — infrastructure calm, not neon. */
      .boot-splash-glow {
        position: absolute;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 42%, rgba(99, 102, 241, 0.22) 0%, rgba(6, 182, 212, 0.08) 42%, transparent 70%);
        filter: blur(2px);
        animation: boot-glow 2.4s ease-in-out infinite alternate;
      }
      html:not(.dark) .boot-splash-glow {
        background:
          radial-gradient(circle at 50% 42%, rgba(99, 102, 241, 0.16) 0%, rgba(6, 182, 212, 0.06) 42%, transparent 70%);
      }

      .boot-splash-mark {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(42, 58, 81, 0.55),
          0 18px 40px -18px rgba(15, 26, 41, 0.55);
        animation: boot-mark-in 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      html:not(.dark) .boot-splash-mark {
        box-shadow:
          0 0 0 1px rgba(42, 58, 81, 0.12),
          0 16px 36px -16px rgba(15, 26, 41, 0.28);
      }
      .boot-splash-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .boot-splash-copy {
        position: relative;
        display: grid;
        gap: 8px;
        justify-items: center;
        animation: boot-copy-in 560ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
      }
      .boot-splash-copy strong {
        font-size: 28px;
        font-weight: 650;
        letter-spacing: 0.02em;
        line-height: 1;
      }
      .boot-splash-bar {
        width: 72px;
        height: 2px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(123, 137, 157, 0.28);
      }
      html.dark .boot-splash-bar { background: rgba(170, 181, 197, 0.18); }
      .boot-splash-bar > span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #4f46e5 0%, #6366f1 40%, #06b6d4 100%);
        animation: boot-bar 1.15s ease-in-out infinite;
      }

      @keyframes boot-mark-in {
        from { opacity: 0; transform: translateY(8px) scale(0.94); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes boot-copy-in {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-bar {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(280%); }
      }
      @keyframes boot-glow {
        from { opacity: 0.7; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1.04); }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash-mark,
        .boot-splash-copy,
        .boot-splash-glow,
        .boot-splash-bar > span {
          animation: none;
        }
        #boot-splash { transition: none; }
      }

      #root { position: relative; z-index: 1; height: 100%; }

      /* xterm: hide a11y text before JS; full CSS is also injected from the JS bundle. */
      .xterm .xterm-accessibility,
      .xterm .xterm-accessibility-tree,
      .xterm .xterm-message {
        display: none !important;
      }
      .xterm .xterm-screen canvas {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 1;
      }
      .xterm canvas {
        display: block !important;
        max-width: none !important;
      }
    </style>
    <script>
      (function () {
        try {
          document.documentElement.classList.toggle(
            "dark",
            window.matchMedia("(prefers-color-scheme: dark)").matches,
          );
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash" role="presentation" aria-hidden="true">
      <div class="boot-splash-stage">
        <div class="boot-splash-glow" aria-hidden="true"></div>
        <div class="boot-splash-mark">
          <img src="./runory-mark.png" width="128" height="128" alt="" />
        </div>
        <div class="boot-splash-copy">
          <strong>Runory</strong>
          <div class="boot-splash-bar" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
