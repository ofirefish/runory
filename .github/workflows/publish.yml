# Build signed desktop installers and upload them to a draft GitHub Release.
# Trigger: push a version tag (v0.1.0) or run manually from Actions.
name: publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # "Missing comment in secret key" almost always means the Repository secret is
      # empty/truncated, or was stored as an Environment secret instead of Actions repo secret.
      - name: Prepare updater signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const raw = process.env.RAW_KEY ?? '';
          const password = process.env.RAW_PASSWORD ?? '';
          const looksLikeMinisign = (text) =>
            text.includes('untrusted comment:') && /secret key/i.test(text);

          if (!raw.trim()) {
            console.error(
              '::error::TAURI_SIGNING_PRIVATE_KEY is empty. Add it under Settings → Secrets and variables → Actions → Repository secrets (not Environment secrets). Paste the full .key file contents.',
            );
            process.exit(1);
          }

          // Tauri STANDARD-base64-decodes the env/file bytes and rejects whitespace.
          // A trailing LF is "Invalid symbol 10"; a space in "untrusted comment:" is
          // "Invalid symbol 32, offset 9". Always feed a single-line base64 blob.
          const stripped = raw.replace(/^\uFEFF/, '').trim();
          let material;
          let format;
          if (looksLikeMinisign(stripped)) {
            const minisign = stripped.endsWith('\n') ? stripped : `${stripped}\n`;
            material = Buffer.from(minisign, 'utf8').toString('base64');
            format = 'minisign-text';
          } else {
            material = stripped.replace(/\s+/g, '');
            format = 'base64';
            try {
              const decoded = Buffer.from(material, 'base64').toString('utf8');
              if (!looksLikeMinisign(decoded)) format = 'unknown';
            } catch {
              format = 'unknown';
            }
          }

          if (format === 'unknown' || !/^[A-Za-z0-9+/]+=*$/.test(material)) {
            console.error(
              '::error::TAURI_SIGNING_PRIVATE_KEY does not look like a Tauri updater private key. Paste the exact contents of the .key file from `pnpm tauri signer generate -w` (usually one base64 line). Do not paste the .pub file or a filesystem path.',
            );
            process.exit(1);
          }

          const keyPath = path.join(process.env.RUNNER_TEMP, 'runory-updater.key');
          fs.writeFileSync(keyPath, material, 'utf8');
          const envPath = keyPath.replace(/\\/g, '/');
          fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_SIGNING_PRIVATE_KEY=${envPath}\n`);
          if (password.length > 0) {
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF\n${password}\nEOF\n`,
            );
            console.log('Updater password secret: set');
          } else {
            console.log('Updater password secret: unset (OK when the key has no password)');
          }
          console.log(
            `Updater private key ready (${format}, ${material.length} chars, ${fs.statSync(keyPath).size} file bytes)`,
          );
          NODE

      - name: Build and upload draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNORY_UPDATER_ENDPOINT: ${{ vars.RUNORY_UPDATER_ENDPOINT }}
          RUNORY_UPDATER_PUBKEY: ${{ vars.RUNORY_UPDATER_PUBKEY }}
          # Signing key/password come from GITHUB_ENV (prepared above).
        with:
          tagName: v__VERSION__
          releaseName: Runory v__VERSION__
          releaseBody: See the release notes for details.
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}
